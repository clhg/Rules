[rewrite_local]
# 深度清洗所有 JSON 响应中的 CPS 推广链接
^https?:\/\/([a-zA-Z0-9-]+\.)*taoyuangu\.com\/.* url script-response-body https://raw.githubusercontent.com/clhg/Rules/main/Loon/TyCleaner.js

[mitm]
hostname = *.taoyuangu.com
