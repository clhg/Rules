#!name=桃源谷首页净化 & 广告拦截
#!desc=去除桃源谷所有推广入口(微信/支付宝/乐园) + 拦截第三方广告
#!author=clhg
#!version=3.4.0

hostname = *.taoyuangu.com

# 开屏广告拦截（纯 rewrite，无需脚本）
^https?:\/\/adfile\.taoyuangu\.com\/adms\/servlet\/getThirdAppAdConfig url reject-dict
^https?:\/\/adfile\.taoyuangu\.com\/adms\/servlet\/getAppPalyList url reject-dict
^https?:\/\/adfile\.taoyuangu\.com\/adms\/servlet\/reportThirdAppAdEventLog url reject-200
^https?:\/\/adsmartget\.datads\.cn\/.* url reject-200

# CPS 推广链接清洗（需要 TyCleaner.js 放本地 Scripts 目录）
# 下载地址：https://raw.githubusercontent.com/clhg/Rules/beta/Loon/TyCleaner.js
^https?:\/\/([a-zA-Z0-9-]+\.)*taoyuangu\.com\/.* url script-response-body TyCleaner.js

# 穿山甲/Pangle 广告 SDK
host-suffix, adsmartget.datads.cn, reject
host-suffix, pglstatp-toutiao.com, reject
host-suffix, volccdn.com, reject
host-suffix, pangle.com, reject
host-suffix, pangleglobal.com, reject
# 被子广告
host-suffix, beizi.biz, reject
# 1rtb 广告
host-suffix, 1rtb.net, reject
host-suffix, 1rtb.com, reject
# HubCloud 广告
host-suffix, hubcloud.com.cn, reject
# 百度联盟
host-suffix, pos.baidu.com, reject
host-suffix, als.baidu.com, reject
# 桃源谷自家广告接口
host, adfile.taoyuangu.com, reject


